[workflow]
name = "codetour"
description = "Generate a CodeTour-compatible .tour file exploring a codebase topic"

[[phases]]
id = "research"
use_tasks = true
required_artifacts = ["research-findings"]
prompt = """
# Research Phase

Explore the codebase to understand the requested topic and identify the key code paths, files, and concepts that the tour should cover.

## Inputs

Read request.md for the topic/question to explore (e.g., "how does auth work", "explain the data pipeline", "how are API endpoints structured").

## Task Creation

Create parallel research tasks to explore different angles of the topic. Typical task breakdown:

### Entry Points Task
Find where the feature is initiated — CLI commands, API endpoints, event handlers, main functions. Search for keywords from the request.

### Core Logic Task
Trace the main code path from entry point through processing. Identify key functions, classes, and data transformations.

### Supporting Infrastructure Task
Find configuration, types/interfaces, utilities, and helpers that the core logic depends on.

### Tests & Examples Task (if relevant)
Find test files and examples that demonstrate the feature's behavior and edge cases.

**Task configuration:**
Each task should use `subagent: "general-purpose"` with `subagent_prompt: "very thorough analysis"` and `model: "opus"`.

**Each task writes findings to its task output directory:**
```bash
TASK_DIR=$(uv run plan.py ensure-task-dir <task-id>)
```

Write `findings.md` with:
- Files discovered and their roles
- Key functions/classes and what they do
- Data flow between components
- Non-obvious design decisions or patterns
- Suggested tour stops based on this angle

## Output

After all research tasks complete, synthesize findings into `research-findings.md`:
- Complete file inventory with roles
- Data/execution flow diagram (text-based)
- Key concepts the tour should explain
- Suggested narrative arc

Record the artifact:
```bash
uv run plan.py record-artifact research-findings research-findings.md
```
"""
suggested_next = [
    { phase = "plan-tour", instruction = "Research complete — plan the tour structure" }
]

[[phases]]
id = "plan-tour"
requires_user_input = true
context_artifacts = ["research-findings"]
required_artifacts = ["tour-plan"]
prompt = """
# Plan Tour Phase

Organize research findings into a narrative tour structure for user approval.

## Inputs

- research-findings.md (injected above) — synthesized research from codebase exploration

## Task

Design the tour's narrative arc. A good codebase tour follows a **story**, not a file tree.

### Narrative Patterns

Choose the pattern that best fits the topic:

1. **Request lifecycle** — Follow a request/event from entry to response (best for APIs, pipelines)
2. **Onion/layers** — Start at the outermost layer and peel inward (best for architecture overviews)
3. **Build-up** — Start with primitives/types and build toward the full feature (best for complex systems)
4. **Chronological** — Follow the order things happen at runtime (best for workflows, state machines)

### Tour Structure

Design 5-15 stops, each with:
- **Title** — thematic name for the stop
- **Files** — which files/locations this stop covers
- **Narrative** — 1-2 sentences on what this stop explains and why it matters
- **Key concept** — the main takeaway from this stop

### Sizing Guidelines
- Simple feature: 5-8 steps
- Medium feature: 8-12 steps
- Complex system: 12-15 steps (or split into chained tours)

## Output

Write `tour-plan.md`:

```markdown
# Tour Plan: {topic}

## Narrative Pattern
{Which pattern and why}

## Tour Overview
{2-3 sentence summary of what the tour covers}

## Stops

### Stop 1: {title}
**Files:** `path/to/file.ts`, `path/to/other.ts`
**Narrative:** {What this stop explains}
**Key concept:** {Main takeaway}

### Stop 2: {title}
...
```

Record the artifact:
```bash
uv run plan.py record-artifact tour-plan tour-plan.md
```

## User Review

Present the tour plan to the user for approval:
- Show the narrative pattern chosen and why
- List all stops with their titles and key concepts
- Note the expected step count
- Ask if any stops should be added, removed, or reordered

## Options
1. **generate-tour** — Plan approved, generate the CodeTour
2. **research** — Need more research on specific areas
3. **plan-tour** — Revise the plan

After presenting options, show: `Use /jons-plan:proceed <number> [optional feedback]` to select.
"""
suggested_next = [
    "generate-tour",
    { phase = "research", requires_approval = true, approval_prompt = "Return to research for additional exploration?" },
    "plan-tour"
]

[[phases]]
id = "generate-tour"
use_tasks = true
context_artifacts = ["tour-plan"]
required_artifacts = ["codetour"]
required_json_artifacts = ["proposals", "challenges"]
prompt = """
# Generate Tour Phase

Generate the CodeTour `.tour` file using parallel subagents — one per stop.

## Inputs

- tour-plan.md (injected above) — approved tour structure with stops, files, and narratives

## CodeTour Format

The output is a single `.tour` JSON file conforming to the CodeTour schema:

```json
{
  "$schema": "https://aka.ms/codetour-schema",
  "title": "{Tour topic}",
  "description": "{1-2 sentence summary of what the tour covers}",
  "steps": [...]
}
```

**Note:** No `ref` field — the tour tracks the current branch so it stays useful as the code evolves. If the user wants to pin it, they can add `ref` manually.

### Step Types

**Content-only steps** (stop separators — no `file` field):
```json
{
  "title": "Stop 1: {stop title}",
  "description": "## {stop title}\\n\\n{1-3 paragraph narrative explaining what this section of the codebase does, why it's designed this way, and what to look for.}"
}
```

**File steps** (anchored to code — has `file` and `pattern`):
```json
{
  "title": "{Short description of what's here}",
  "file": "{relative/path/to/file}",
  "pattern": "{unique regex matching one line}",
  "description": "{2-5 sentences explaining what this code does, why it's designed this way, and how it connects to the broader feature. Point out non-obvious design decisions.}"
}
```

### Pattern Rules

Patterns MUST:
1. Be a JavaScript regex (no flags) that matches exactly ONE line in the target file
2. Be JSON-escaped (double backslashes: `\\b`, `\\(`, `\\[`)
3. Anchor to distinctive code: function signatures, class/struct declarations, unique string literals
4. NOT match generic lines like `import`, `return`, `use`, `}`, blank lines

**Pattern generation process:**
1. Read the target file
2. Identify the most distinctive line at or near the conceptual anchor point
3. Extract a regex fragment from that line
4. Escape regex metacharacters
5. **Verify uniqueness**: `grep -cE '{pattern}' {file}` must return exactly 1

**Fallback to `line`:** If a pattern absolutely cannot be made unique, use the `line` field (1-based) instead. Prefer `pattern` whenever possible.

### Step-per-Stop Guidance

- **One step per conceptual anchor** — each file step should explain one specific piece of the feature
- **1-4 file steps per stop** — stops should be focused, not exhaustive
- **Target 5-15 total steps** (including content-only separator steps)
- **Follow the narrative flow** from the tour plan, not the file tree

## Task Creation

Read tour-plan.md to get the stops. Create tasks dynamically:

### 1. `generate-overview` task (no parents)

Produces `codetour/overview.json`:

```json
{
  "$schema": "https://aka.ms/codetour-schema",
  "title": "{Tour topic}",
  "description": "{1-2 sentence summary}",
  "overview_step": {
    "title": "Overview",
    "description": "## {Tour topic}\\n\\n{2-3 paragraph overview of the feature/system and what this tour covers. Mention the number of stops and the narrative arc.}"
  }
}
```

### 2. Per-stop tasks: `generate-stop-01`, `generate-stop-02`, ... (parents: [`generate-overview`])

One task per stop. Each reads the relevant source files directly from the codebase and produces `codetour/stop-NN.json`:

```json
{
  "number": 1,
  "separator_step": {
    "title": "Stop 1: {title}",
    "description": "## {title}\\n\\n{narrative preamble...}"
  },
  "file_steps": [
    {
      "title": "{Short description}",
      "file": "src/auth/middleware.ts",
      "pattern": "export class AuthMiddleware",
      "description": "{2-5 sentences explaining this code...}"
    }
  ]
}
```

**Each stop task receives in its `subagent_prompt`:**
- The stop's entry from tour-plan.md (title, files, narrative, key concept)
- Instructions to read the actual source files and generate patterns

**Each stop task MUST:**
1. Read each source file listed for this stop
2. Identify the best anchor points for file steps
3. Generate patterns and verify uniqueness against the actual file
4. Write the separator step and file steps to `codetour/stop-NN.json`

### 3. `assemble-tour` task (parents: all stop tasks)

Reads `codetour/overview.json` and all `codetour/stop-NN.json` fragments. Assembles the final `.tour` file:

1. Start with overview metadata ($schema, title, description)
2. Add the overview step
3. For each stop (in order): add separator step, then file steps
4. Write `codetour/{kebab-title}.tour`

Records the artifact:
```bash
uv run plan.py record-artifact codetour codetour/{kebab-title}.tour
```

## Narrative Voice
- Written for a developer learning the codebase, not reviewing changes
- Explain *why* the code is designed this way, not just *what* it does
- Call out non-obvious design decisions, patterns, and architectural choices
- Connect each step to the broader feature story
- Reference specific function names, types, and patterns
- Concise: 2-5 sentences per step description
- Assume the reader can see the code in VS Code — don't restate it
"""
suggested_next = [
    { phase = "quality-gate", instruction = "Tour generated — review for quality" }
]

[[phases]]
id = "quality-gate"
use_tasks = true
max_retries = 2
context_artifacts = ["codetour"]
required_tasks = [
  { id = "pattern-validation", description = "Verify every pattern in the .tour file matches exactly one line in its target file", subagent = "general-purpose", subagent_prompt = "For each step in the .tour file that has a 'file' and 'pattern' field: (1) Read the .tour file from the codetour artifact (use `uv run plan.py input-artifacts --json` to find it). (2) Read each referenced file directly from the codebase. (3) Count how many lines match the pattern regex using `grep -cE`. (4) Report: PASS if exactly 1 match, FAIL if 0 or 2+ matches. Include the pattern, file, match count, and matching lines. Write results to pattern-validation.md.", model = "sonnet" },
  { id = "slop-detection", description = "Scan tour step descriptions for AI-generated patterns", subagent = "general-purpose", prompt_file = "slop-detection", subagent_prompt = "Scan all step descriptions in the .tour file for AI-generated patterns. Use `uv run plan.py input-artifacts --json` to find the codetour artifact path, then read the .tour JSON and extract all description fields.", model = "haiku" },
  { id = "quality-review", description = "Review tour for schema compliance, step quality, and narrative usefulness", subagent = "general-purpose", prompt_file = "codetour-spec", subagent_prompt = "Review this CodeTour .tour file for quality. This is a topic-based tour (not PR-based), so skip hunk coverage checks. Focus on: narrative flow (does the tour tell a coherent story?), step anchoring quality, description accuracy, and whether the tour actually answers the question posed in request.md. Tag each issue as Critical, Suggestion, or Nit.", model = "opus" },
  { id = "codex-accuracy-review", description = "Verify step descriptions accurately match the actual source code at each pattern location", executor = "codex-review", subagent_prompt = "Read the .tour JSON file (find it via `uv run plan.py input-artifacts --json`). For each file step, read the actual source file at the pattern location and verify:\n\n1. **Description accuracy** — Does the explanation accurately describe what the code does? Flag any misrepresented behavior, wrong function names, or hallucinated design decisions.\n2. **Completeness** — Does the description cover the key aspects of the code at this location, or does it miss important details?\n3. **Connections** — Are claimed relationships to other parts of the codebase accurate?\n\nWrite `codex-accuracy-review.md` with per-step verdicts (accurate / inaccurate + what's wrong). Tag each finding as Critical, Suggestion, or Nit.", parents = [] },
  { id = "synthesize-feedback", description = "Synthesize all review feedback into tour-feedback.md", parents = ["pattern-validation", "slop-detection", "quality-review", "codex-accuracy-review"] }
]
prompt = """
# Quality Gate Phase

Review the generated CodeTour for quality before presenting to the user.

## Inputs

- .tour file (artifact path injected above) — the CodeTour JSON

Resolve artifact paths:
```bash
uv run plan.py input-artifacts --json
```

## Tasks

Run the required tasks:
1. **Pattern validation** (sonnet) — read each referenced file and verify every pattern matches exactly one line
2. **Slop detection** (haiku) — scan step descriptions for AI-generated patterns
3. **Quality review** (opus) — schema compliance, narrative flow, description quality, whether the tour answers the topic question
4. **Codex accuracy review** — read the actual source code at each step's location and verify descriptions are accurate
5. **Synthesize** — combine all feedback into tour-feedback.md organized by severity

## Output

Write `tour-feedback.md` with feedback organized by severity (Critical, Suggestion, Nit).

Critical issues include:
- Patterns matching 0 or 2+ lines (broken step anchoring)
- Invalid JSON schema
- Steps with no description
- Descriptions that misrepresent the code

Suggestions include:
- Generic patterns that might break on refactor
- Steps that restate code instead of explaining WHY
- Missing overview step
- Narrative that doesn't flow logically
- Tour doesn't answer the original question
"""
suggested_next = [
    { phase = "revise", instruction = "Feedback received — revise the tour" },
    { phase = "complete", instruction = "Tour quality is acceptable — skip revision" }
]

[[phases]]
id = "revise"
context_artifacts = ["codetour"]
required_artifacts = ["codetour"]
prompt = """
# Revise Phase

Apply accepted feedback to improve the CodeTour.

## Inputs

- .tour file (artifact path injected above) — current CodeTour JSON
- tour-feedback.md — from quality-gate phase

Read tour-feedback.md from the quality-gate phase directory:
```bash
uv run plan.py input-artifacts --json
```

## Process

1. Read tour-feedback.md
2. For each item:
   - **Critical**: Must fix (especially broken patterns and inaccurate descriptions)
   - **Suggestion**: Fix if it clearly improves the tour
   - **Nit**: Fix only if trivial; otherwise skip
3. For broken patterns:
   - Read the target file
   - Find a better anchor line
   - Verify the new pattern matches exactly one line
4. For inaccurate descriptions:
   - Re-read the source code
   - Rewrite the description to accurately reflect what the code does
5. Edit the .tour JSON file directly
6. Write brief revision notes in revision-log.md

## Output

Updated .tour file. Record the artifact:
```bash
uv run plan.py record-artifact codetour <path-to-updated-tour-file>
```
"""
suggested_next = [
    { phase = "quality-gate", instruction = "Revision complete — re-verify quality" },
    { phase = "complete", instruction = "Revisions complete — present to user" }
]

[[phases]]
id = "complete"
terminal = true
context_artifacts = ["codetour"]
prompt = """
# Complete Phase

Present the CodeTour to the user.

## Inputs

- .tour file (artifact path injected above) — the final CodeTour JSON

Locate the .tour file:
```bash
uv run plan.py input-artifacts --json
```

## Tasks

1. Read the .tour file and present a summary:
   - Tour title and description
   - Number of stops (content-only separator steps)
   - Number of file steps
   - Files covered
   - Narrative pattern used

2. Show the first few steps as a preview so the user can see the format.

3. Offer next actions:
   - **Copy to project**: Copy the .tour file to the project's `.tours/` directory:
     ```bash
     TOUR_FILE="<path to .tour file>"
     PROJECT_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
     mkdir -p "$PROJECT_ROOT/.tours"
     cp "$TOUR_FILE" "$PROJECT_ROOT/.tours/"
     echo "Copied to $PROJECT_ROOT/.tours/"
     ```
   - **Open in editor**: Open the .tour file for manual review
   - **View raw JSON**: Display the full .tour contents

4. Note that:
   - The CodeTour VS Code extension must be installed for interactive navigation
   - Patterns are regex-based and may need updating if the anchored code changes significantly
   - No `ref` is set — the tour tracks the current branch

This is a terminal phase. The CodeTour generation is complete.
"""
